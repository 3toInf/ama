<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AMA 命令面板</title>
  <link rel="stylesheet" href="palette.css">
  <script type="module" src="palette.js"></script>
</head>
<body>
  <div id="palette-surface">
  <header class="query"><span data-icon="search"></span><input id="palette-input" role="combobox" aria-label="搜索标签、输入网址或命令" aria-controls="palette-list" aria-expanded="true" aria-autocomplete="list" placeholder="搜索或输入网址…" autocomplete="off" spellcheck="false" maxlength="8192"><button id="palette-close" type="button" aria-label="关闭命令面板" title="关闭 · Esc" data-icon="close"></button></header>
  <main>
    <div id="palette-error" role="alert" hidden></div>
    <div id="palette-list" role="listbox" aria-label="搜索结果与命令"></div>
    <p id="palette-empty" hidden>没有匹配的命令。试试“new tab”或“settings”。</p>
  </main>
  <footer><span class="palette-context"><span data-icon="panel"></span><span id="palette-workspace">命令面板</span></span><span class="palette-help">↑ ↓ 选择 <b>&gt;</b> 命令 <b>Esc</b> 关闭</span><span id="palette-count" class="sr-only" aria-live="polite"></span></footer>
  </div>
</body>
</html>
